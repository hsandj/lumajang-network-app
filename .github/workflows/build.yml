name: Build Android APK and iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Complete Android Platform Scaffolding
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml || true
          rm -rf android
          flutter create --org id.lumajangnetwork --project-name lumajang_network_app --platforms=android .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
        shell: bash

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumajangNetwork-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA / App
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Complete iOS Platform Scaffolding
        run: |
          mkdir -p /tmp/backup
          cp ios/Runner/Info.plist /tmp/backup/Info.plist || true
          rm -rf ios
          flutter create --org id.lumajangnetwork --project-name lumajang_network_app --platforms=ios .
          cp /tmp/backup/Info.plist ios/Runner/Info.plist || true
        shell: bash

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No codesign for direct export / testing)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r LumajangNetwork.ipa Payload/
        shell: bash

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumajangNetwork-iOS-IPA
          path: LumajangNetwork.ipa
